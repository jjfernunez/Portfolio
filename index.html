<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Currículum</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }
    header {
      text-align: center;
      padding: 4rem 1rem;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      margin-top: 2rem;
    }
    .fade-words span {
      display: none;
      font-weight: bold;
      color: #0d6efd;
    }
    .fade-words span.active {
      display: inline;
      animation: fadeinout 2s infinite;
    }
    @keyframes fadeinout {
      0% { opacity: 0; }
      25% { opacity: 1; }
      75% { opacity: 1; }
      100% { opacity: 0; }
    }
    .contact-icons {
      margin-top: 2rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
    }
    .contact-icons i {
      font-size: 1.8rem;
      cursor: pointer;
      color: #0d6efd;
    }
    .contact-text {
      display: none;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <!-- Chipp Chat Widget -->
  <script>
    window.CHIPP_APP_URL = "https://asistentedejuanjose-62329.chipp.ai";
    window.CHIPP_APP_ID = 62329;
  </script>
  
  <link rel="stylesheet" href="https://storage.googleapis.com/chipp-chat-widget-assets/build/bundle.css" />
  
  <script defer src="https://storage.googleapis.com/chipp-chat-widget-assets/build/bundle.js"></script>
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Juan José Fernández</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="./Portfolio.html">Portfolio</a></li>
          <li class="nav-item"><a class="nav-link" href="./Contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <header class="container mt-4">
    <img src="./imagenes/Foto_Perfil.jpg" alt="Mi Foto" class="rounded-circle mb-3" style="width: 150px; height: 150px; object-fit: cover;">
    <h1 class="fw-bold">Juan José Fernández Núñez</h1>
    <p class="lead">Programador <span class="fade-words">
      <span class="active">.NET</span>
      <span>Angular</span>
      <span>Java</span>
      <span>Node.js</span>
      <span>SQL</span>
    </span></p>

    <div class="contact-icons">
      <i class="fas fa-phone" onclick="toggleContact('telefono')"></i>
      <i class="fas fa-envelope" onclick="toggleContact('correo')"></i>
      <i class="fab fa-linkedin" onclick="toggleContact('linkedin')"></i>
    </div>

    <div class="contact-text" id="telefono">
      <p class="text-muted">+34 675 124 454</p>
    </div>
    <div class="contact-text" id="correo">
      <p class="text-muted">jj.fernandez.nunez@gmail.com</p>
    </div>
    <div class="contact-text" id="linkedin">
      <p class="text-muted"><a href="https://www.linkedin.com/in/juan-jose-fernandez-nunez-6338701b1/" target="_blank">linkedin.com/in/JuanJoseFernandez</a></p>
    </div>
  </header>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const words = document.querySelectorAll('.fade-words span');
    let index = 0;
    setInterval(() => {
      words[index].classList.remove('active');
      index = (index + 1) % words.length;
      words[index].classList.add('active');
    }, 2000);

    function toggleContact(id) {
      const blocks = document.querySelectorAll('.contact-text');
      blocks.forEach(el => {
        if (el.id === id) {
          el.style.display = el.style.display === 'block' ? 'none' : 'block';
        } else {
          el.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
